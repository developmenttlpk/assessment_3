<div class="card shadow-sm">
  <div class="card-header bg-white">
    <h5 class="mb-0">Summary</h5>
    <small class="text-muted">{{ caption }}</small>
  </div>

  <div class="table-responsive">
    <table class="table table-bordered table-striped table-hover mb-0">
      <thead class="table-light">
        <tr>
          <th>Metric</th>
          <th class="text-end">Target</th>
          <th class="text-end">Actual</th>
          <th class="text-end">Variance</th>
          <th class="text-end">Variance %</th>
        </tr>
      </thead>
      <tbody>
        @for (row of rows; track row.key) {
          <tr>
            <td>{{ row.label }}</td>
            <td class="text-end">{{ showValue(row, row.target) }}</td>
            <td class="text-end">{{ showValue(row, row.actual) }}</td>
            <td class="text-end" [class]="row.status" data-test="variance">{{ showVariance(row) }}</td>
            <td class="text-end" [class]="getPercentClass(row)">{{ showVariancePercent(row) }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
